[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wangdao-project"
version = "0.1.0"
description = "复旦大学 FDUROP 望道项目"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "torch>=2.0"
]

[tool.setuptools]
package-dir = {"" = "software"}

[tool.setuptools.packages.find]
where = ["software"]
include = ["wangdao*"]

[tool.pyright]
include = ["software/wangdao", "software/scripts", "software/tests"]
extraPaths = ["software"]
typeCheckingMode = "basic"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wangdao-mlp-to-snn"
version = "0.1.0"
description = "望道项目MLP到SNN转换、定点化与近似计算"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "torch>=2.0"
]

[tool.setuptools]
package-dir = {"" = "software"}

[tool.setuptools.packages.find]
where = ["software"]
include = ["wangdao*"]

[tool.setuptools.package-data]
"wangdao.fred_adapter_v1" = ["*.cpp", "vendor/*.cpp", "vendor/*.h", "vendor/LICENSE", "vendor/source.json"]
"wangdao.h2pro_snn" = ["*.json"]
"wangdao.h2pro_snn_v2" = ["*.json"]
"wangdao.h2pro_snn_v2_1" = ["*.json"]
"wangdao.h2pro_snn_v2_2" = ["*.json"]
"wangdao.h2pro_ann_state_v1" = ["*.json"]
"wangdao.h2pro_ann_readout_v1" = ["*.json"]
"wangdao.h2pro_direct_v1" = ["*.json"]
"wangdao.h2pro_calibration_v1" = ["*.json"]
"wangdao.h2pro_task_calibration_v1" = ["*.json"]

[tool.pyright]
include = ["software/wangdao", "software/scripts", "software/tests"]
extraPaths = ["software"]
typeCheckingMode = "basic"
